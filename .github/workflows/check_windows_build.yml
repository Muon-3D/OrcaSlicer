name: Windows build tooling

on:
  pull_request:
    branches: [muon3d-m1]
    paths:
      - build_release_vs.bat
      - scripts/test_windows_build_failures.py
      - scripts/test_windows_ci.py
      - deps/python3/**
      - .github/workflows/check_windows_build.yml
      - .github/workflows/build_*.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-build-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows_failure_probes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary-arch: x86_64
          - os: windows-11-arm
            binary-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'false'
      - name: Install native CMake
        shell: pwsh
        run: |
          $ver = "4.3.5"
          $arch = "${{ matrix.binary-arch }}"
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-$arch.zip" -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive "$env:RUNNER_TEMP\cmake.zip" "$env:RUNNER_TEMP\cmake" -Force
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\cmake\cmake-$ver-windows-$arch\bin"
      - name: Run actual batch failure probes
        shell: pwsh
        run: |
          python -m pip install ninja==1.13.2 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw "Ninja test dependency install failed" }
          python scripts/test_windows_ci.py
          if ($LASTEXITCODE -ne 0) { throw "Windows CI configuration probes failed" }
          python scripts/test_windows_build_failures.py

  windows_build_x64:
    needs: windows_failure_probes
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      build-deps-only: false
    secrets: inherit

  windows_build_arm64:
    needs: windows_failure_probes
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-11-arm
      arch: arm64
      build-deps-only: false
    secrets: inherit

  # Keep the successful architecture's tests running if the other build fails.
  # github.sha is the tested PR merge revision, shared with the artifact producer.
  windows_tests_x64:
    needs: windows_build_x64
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64
      test-dir: build/tests

  windows_tests_arm64:
    needs: windows_build_arm64
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-11-arm
      artifact: ${{ github.sha }}-tests-windows-arm64
      test-dir: build-arm64/tests

name: Windows build tooling

on:
  pull_request:
    branches: [muon3d-m1]
    paths:
      - build_release_vs.bat
      - scripts/test_windows_build_failures.py
      - .github/workflows/check_windows_build.yml
      - .github/workflows/build_*.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-build-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: false
    secrets: inherit

  windows_tests:
    needs: windows_build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            test-dir: build/tests
          - os: windows-11-arm
            arch: arm64
            test-dir: build-arm64/tests
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ matrix.os }}
      artifact: ${{ github.sha }}-tests-windows-${{ matrix.arch }}
      test-dir: ${{ matrix.test-dir }}

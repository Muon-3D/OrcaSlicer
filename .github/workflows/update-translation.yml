name: Update Translation Catalog
on: 
  # schedule:
  #   - cron: 0 0 * * 1
  workflow_dispatch:

jobs:
  update_translation:
    name: Update translation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","muon-ci"]') }}
    steps:  
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install gettext
        run: |
          # The self-hosted pool has no sudo; it ships gettext already.
          if ! command -v msgfmt >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext
          fi

      - name: Update translation catalog
        run: |
          ./scripts/run_gettext.sh --full
          git add localization/i18n/*

      - name: Commit translation catalog updates
        uses: qoomon/actions--create-commit@v1
        id: commit
        with:
          message: Update translation catalog
          skip-empty: true

      - name: Push changes
        run: git push

name: Check profiles
on: 
  pull_request:
    branches: 
    - main 
    paths:
    - 'resources/profiles/**'
    - ".github/workflows/check_profiles.yml"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'


jobs:
  check_translation:
    name: Check profiles
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","muon-ci"]') }}
    steps:  
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run extra JSON check
        run: |
          python3 ./scripts/orca_extra_profile_check.py

      # download
      - name: Download 
        working-directory: ${{ github.workspace }}
        run: |
          curl -LJO https://github.com/SoftFever/Orca_tools/releases/download/1/OrcaSlicer_profile_validator
          chmod +x ./OrcaSlicer_profile_validator

      # validate profiles
      - name: validate system profiles
        run: |
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -l 2

      # KAN-1177: the nightly orca_custom_preset_tests.zip is made from upstream's current
      # profiles, so its presets inherit printers this older tree doesn't have ("can not find
      # parent"). Use upstream's per-release fixture archives instead, pinned by SHA-256, each
      # validated against its own copy of this tree. A release newer than this tree is only
      # reported: its presets may name printers added after our base.
      - name: validate custom presets
        working-directory: ${{ github.workspace }}
        env:
          FIXTURES_URL: https://github.com/OrcaSlicer/OrcaSlicer-profile-validator/releases/download/fixture-archive
          # Newest release whose fixtures must pass. Raise it when this tree is rebased.
          REQUIRED_UP_TO: v2.3.0
        run: |
          status=0
          while read -r version sha256; do
            zip="${RUNNER_TEMP}/orca_custom_presets_${version}.zip"
            tree="${RUNNER_TEMP}/profiles-${version}"
            curl -fsSL -o "${zip}" "${FIXTURES_URL}/orca_custom_presets_${version}.zip"
            echo "${sha256}  ${zip}" | sha256sum -c -
            rm -rf "${tree}" && mkdir -p "${tree}"
            cp -a resources/profiles/. "${tree}/"
            rm -rf "${tree}/user"
            unzip -q "${zip}" -d "${tree}"
            if ./OrcaSlicer_profile_validator -p "${tree}" -l 2 > "${RUNNER_TEMP}/custom-${version}.log" 2>&1; then
              echo "${version}: PASS"
            elif [ "$(printf '%s\n' "${version}" "${REQUIRED_UP_TO}" | sort -V | tail -n1)" = "${REQUIRED_UP_TO}" ]; then
              echo "::error::${version} custom presets: FAIL"
              tail -n 40 "${RUNNER_TEMP}/custom-${version}.log"
              status=1
            else
              echo "${version}: FAIL, newer than ${REQUIRED_UP_TO}, not required" \
                "($(grep -c 'can not find parent' "${RUNNER_TEMP}/custom-${version}.log") missing parents)"
            fi
          done <<'EOF'
          v1.9.0 488ffa7bfa5b3c568504ea71b3fde7f2edcec1e21be5aa75987d832879837ebd
          v1.9.1 bf30e47eccbe087b9018003186d3baa1f04715d6fe444477c146e3098f774544
          v2.0.0 879782f5d9decd1d6e55c1885bd97d21eeaa13ae0af6790b0f5c02f0d8259251
          v2.1.0 86ec74d19e520763f54d931e4331757efb5f6ba3f8922d5537049106d7536639
          v2.2.0 c173f6b4360ad574ad337cf66b960756381a4df6617665391c475734d21f2dde
          v2.3.0 4f258e2a85afeb24800ef3e4297faf1fe596b170d981965eb3842b176f29f797
          v2.3.1 ea7f1bee929919471cc7f966d72ec1e18626d5f417d982c049df2f4bee6b2baa
          v2.3.2 4407354601386a44e6fc16b99f3acde8752af8e2c72d5867505ed54116d90deb
          v2.4.0 a02f4b2acde875fbd66a7e46b6985c61b7efd368df7c831bd9e51ca6009a94f4
          v2.4.1 66e17fe3fe6a6d79faa20720e8ed6eff2b266eadfcd37950655b590b44b282ad
          v2.4.2 48439249e401fea8253bdfbf0ad7e8103bfc9049d154e5a13281610319517132
          EOF
          exit "${status}"





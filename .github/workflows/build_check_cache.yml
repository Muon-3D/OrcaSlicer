name: Check Cache

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean
  
jobs:
  check_cache: # determines if there is a cache and outputs variables used in caching process
    name: Check Cache
    # Runner policy for the build chain (repeated in build_deps.yml and build_orca.yml):
    # - Linux builds use the self-hosted pool (HEAVY_LINUX_RUNS_ON, else LINUX_RUNS_ON), only for
    #   pushes and same-repo PRs, and only on a manual run unless HEAVY_BUILDS is 'true'.
    # - Windows and macOS need GitHub-hosted runners: off unless ALLOW_HOSTED_RUNNERS is 'true'.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      ((startsWith(inputs.os, 'ubuntu-') && (github.event_name == 'workflow_dispatch' || vars.HEAVY_BUILDS == 'true')) ||
       (!startsWith(inputs.os, 'ubuntu-') && vars.ALLOW_HOSTED_RUNNERS == 'true'))
    runs-on: ${{ startsWith(inputs.os, 'ubuntu-') && fromJSON(vars.HEAVY_LINUX_RUNS_ON || vars.LINUX_RUNS_ON || '["self-hosted","muon-ci"]') || inputs.os }}
    outputs:
      cache-key: ${{ steps.set_outputs.outputs.cache-key }}
      cache-path: ${{ steps.set_outputs.outputs.cache-path }}
      valid-cache: ${{ steps.cache_deps.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
        
      - name: set outputs
        id: set_outputs
        env:
          # todo: this is mad! refactor other build scripts to use same name
          dep-folder-name: ${{ inputs.os == 'windows-latest' && '/OrcaSlicer_dep' || inputs.os == 'macos-14' && '' || inputs.os != 'macos-14' && '/destdir' || '' }}
          output-cmd: ${{ inputs.os == 'windows-latest' && '$env:GITHUB_OUTPUT' || '"$GITHUB_OUTPUT"'}}
        run: |
          echo cache-key=${{ inputs.os }}-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }} >> ${{ env.output-cmd }}
          echo cache-path=${{ github.workspace }}/deps/build${{ env.dep-folder-name }} >> ${{ env.output-cmd }}
            
      - name: load cache
        id: cache_deps
        uses: actions/cache@v4
        with:
          path: ${{ steps.set_outputs.outputs.cache-path }}
          key: ${{ steps.set_outputs.outputs.cache-key }}
          lookup-only: true
        
  build_deps: # call next step
    name: Build Deps
    needs: [check_cache]
    uses: ./.github/workflows/build_deps.yml
    with:
      cache-key: ${{ needs.check_cache.outputs.cache-key }}
      cache-path: ${{ needs.check_cache.outputs.cache-path }}
      valid-cache: ${{ needs.check_cache.outputs.valid-cache == 'true' }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit
